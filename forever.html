<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forever</title>
<style>
body{
  height:100vh;
  margin:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:#fff0f5;
  font-family:Arial;
  text-align:center;
}
h1{
  color:#ff3366;
}
.heart{
  display:inline-block;
  animation:beat 1s infinite;
}
@keyframes beat{
  0%{transform:scale(1)}
  30%{transform:scale(1.3)}
  60%{transform:scale(1)}
}
.flower{
  font-size:100px;
  margin:20px;
}
p{
  color:#555;
}
</style>
</head>

<body>

<h1>I LOVE YOU BABE FOREVER <span class="heart">❣️</span></h1>
<div class="flower">🌹</div>
<p>TILL THE FLOWER DIES (IT WILL NEVER…..)</p>

</body>
</html>
